name: Deploy to Wasmer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/wasmer-trigger

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
      WASMER_OWNER: ${{ secrets.WASMER_OWNER }}
      WASMER_APP_NAME: zimmermann-website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run validate

      - name: Build Astro site
        run: npm run build

      - name: Check Wasmer credentials
        shell: bash
        run: |
          if [ -z "$WASMER_TOKEN" ]; then
            echo "Missing GitHub Actions secret: WASMER_TOKEN"
            exit 1
          fi
          if [ -z "$WASMER_OWNER" ]; then
            echo "Missing GitHub Actions secret: WASMER_OWNER"
            exit 1
          fi

      - name: Install Wasmer CLI
        shell: bash
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Prepare Wasmer package
        shell: bash
        run: |
          cat > wasmer.toml <<EOF
          [package]
          name = "${WASMER_OWNER}/zimmermann-website-deploy"
          version = "0.0.${GITHUB_RUN_NUMBER}"
          description = "Ubezpieczenia Zimmermann - Astro production build"

          [dependencies]
          "wasmer/static-web-server" = "1"

          [fs]
          "/public" = "dist"

          [[command]]
          name = "serve"
          module = "wasmer/static-web-server:webserver"
          runner = "https://webc.org/runner/wasi"
          EOF

          cat > app.yaml <<EOF
          kind: wasmer.io/App.v0
          owner: ${WASMER_OWNER}
          name: ${WASMER_APP_NAME}
          package: .
          redirect:
            force_https: true
          health_checks:
            - http:
                method: get
                path: /
                interval: 30s
                timeout: 10s
                unhealthy_threshold: 2
                healthy_threshold: 1
                expected_status_codes:
                  - 200
          EOF

      - name: Deploy production build to Wasmer
        shell: bash
        run: |
          WASMER_TOKEN="$(printf '%s' "$WASMER_TOKEN" | tr -d '\r\n')"
          WASMER_OWNER="$(printf '%s' "$WASMER_OWNER" | tr -d '\r\n')"
          export WASMER_TOKEN WASMER_OWNER
          wasmer --version
          printf 'y\ny\ny\ny\n' | wasmer deploy --token "$WASMER_TOKEN"
