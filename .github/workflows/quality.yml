name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - agent/zimmermann-premium-redesign

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate structure
        run: npm run validate

      - name: Build Astro site
        run: npm run build
