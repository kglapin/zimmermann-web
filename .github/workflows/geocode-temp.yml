name: Verify office coordinates

on:
  pull_request:
  push:
    branches:
      - agent/zimmermann-premium-redesign

permissions:
  contents: read

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - name: Geocode Kalisz
        run: |
          curl --fail --silent --show-error \
            -A "Zimmermann website coordinate verification" \
            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=3&countrycodes=pl&q=Konopnickiej%203-5%2C%2062-800%20Kalisz" | jq .
      - name: Respect public service interval
        run: sleep 2
      - name: Geocode Krotoszyn
        run: |
          curl --fail --silent --show-error \
            -A "Zimmermann website coordinate verification" \
            "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=3&countrycodes=pl&q=Piastowska%2030%2C%2063-700%20Krotoszyn" | jq .
